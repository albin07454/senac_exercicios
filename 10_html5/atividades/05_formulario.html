<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
</head>
<body>
    <h1>Cadastro de Produtos</h1>
    <form>
        <p>
            <label for="codigo">Código:</label>
            <input type="text" id="codigo" name="codigo" required>
        </p>

        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="codigo" required>
        </p>

        <p>
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" name="quantidade" min="0" step="1" required>
        </p>

        <p>
            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Selecione...</option>
                <option value="informatica">Informática</option>
                <option value="papelaria">Papelaria</option>
                <option value="eletronicos">Eletrônicos</option>
            </select>

        </p>

        <p>
            <label for="descriçao">Descrição:</label><br>
            <textarea id="descriçao" name="descriçao" rows="4" cols="30"></textarea>
        </p>
    </form>
    </body>
</html>
